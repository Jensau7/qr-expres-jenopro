<!-- Selector de Plantilla -->
<div style="background: #2a2a2a; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
    <h3>🎨 Seleccionar Estilo de Menú / Carta</h3>
    <form action="/cambiar_plantilla" method="POST">
        <select name="plantilla" style="width: 100%; padding: 8px; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 4px; margin-bottom: 10px;">
            <option value="carpinteria" {% if usuario.plantilla == 'carpinteria' %}selected{% endif %}>🪵 Carpintería / Rústico (Tonos madera)</option>
            <option value="restaurante" {% if usuario.plantilla == 'restaurante' %}selected{% endif %}>🍔 Restaurante / Comida (Moderno)</option>
            <option value="minimalista" {% if usuario.plantilla == 'minimalista' %}selected{% endif %}>✨ Servicios / General (Limpio y elegante)</option>
        </select>
        <button type="submit" style="background: #219ebc; color: #fff;">Guardar Estilo</button>
    </form>
    <div style="margin-top: 15px; text-align: center;">
        <a href="/menu" target="_blank" style="color: #ffb703; font-weight: bold; text-decoration: none;">👁️ Ver Menú Público en vivo</a>
    </div>
</div>
