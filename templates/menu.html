<!-- CÓDIGO PARA REEMPLAZAR EN TEMPLATES/MENU.HTML -->
<div class="row g-3">
    {% for p in productos %}
    <div class="col-12 col-md-6">
        <div class="card product-card h-100 p-3 shadow-sm">
            <div class="d-flex align-items-center gap-3">
                {% if p.imagen %}
                <img src="{{ url_for('static', filename='uploads/' + p.imagen) }}" class="rounded" style="width: 80px; height: 80px; object-fit: cover;" alt="{{ p.nombre_prod }}">
                {% endif %}
                <div class="flex-grow-1">
                    <h5 class="fw-bold mb-1">{{ p.nombre_prod }}</h5>
                    <p class="small text-muted mb-2">{{ p.descripcion or '' }}</p>
                    <span class="badge badge-price fs-6">${{ "%.2f"|format(p.precio) }}</span>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
