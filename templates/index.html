cat << 'EOF' > templates/index.html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Exprés JeNoPro - Crea tu Tarjeta Digital</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; max-width: 420px; width: 100%; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { text-align: center; color: #0088ff; margin-bottom: 20px; }
        label { font-weight: bold; font-size: 14px; color: #333; display: block; margin-top: 12px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; background: #0088ff; color: white; border: none; padding: 12px; margin-top: 20px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        button:hover { background: #0066cc; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2>⚡ QR EXPRÉS JENOPRO</h2>
            <p>Genera tu Tarjeta Digital al instante</p>
        </div>
        <form action="/preview" method="POST">
            <label for="negocio">Nombre de tu Negocio / Profesión:</label>
            <input type="text" id="negocio" name="negocio" placeholder="Ej. INGENIO EN MADERA" required>

            <label for="telefono">Número de WhatsApp (con clave de país 52):</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Ej. 526143665161" required>

            <label for="mensaje">Mensaje predeterminado del cliente:</label>
            <textarea id="mensaje" name="mensaje" rows="3" placeholder="Ej. ¡Hola! Vi tu tarjeta digital y quiero pedir una cotización."></textarea>

            <button type="submit">Generar Mi Vista Previa</button>
        </form>
    </div>
</body>
</html>
EOF
