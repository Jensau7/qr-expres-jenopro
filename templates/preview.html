<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código QR - {{ usuario.nombre }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; text-align: center; padding-top: 40px; }
        .card-qr { background: #fff; border-radius: 10px; padding: 30px; max-width: 400px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card-qr">
            <h3 class="fw-bold text-dark mb-1">{{ usuario.nombre }}</h3>
            <p class="text-muted small mb-4">Escanea para ver el menú digital</p>
            
            <div class="mb-4">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://qr-expres-jenopro.onrender.com/menu/{{ usuario.id }}" alt="QR Menú" class="img-fluid border p-2 rounded">
            </div>

            <a href="/menu/{{ usuario.id }}" target="_blank" class="btn btn-primary w-100 mb-2">
                <i class="fa-solid fa-eye me-1"></i> Ver Menú Público
            </a>
            <a href="/panel" class="btn btn-outline-secondary w-100">
                <i class="fa-solid fa-arrow-left me-1"></i> Regresar al Panel
            </a>
        </div>
    </div>
</body>
</html>
