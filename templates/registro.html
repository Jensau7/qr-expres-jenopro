<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - JeNoPro QR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 15px;
        }
        .card-registro {
            background: #161b22;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .logo-circle {
            width: 75px;
            height: 75px;
            margin: 0 auto 12px auto;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }
        .form-label {
            color: #cbd5e1 !important;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .form-control {
            background-color: #0d1117 !important;
            color: #ffffff !important;
            border: 1px solid #30363d !important;
            font-size: 0.9rem;
            padding: 10px 12px;
        }
        .form-control::placeholder {
            color: #64748b !important;
            opacity: 1;
        }
        .form-control:focus {
            border-color: #f59e0b !important;
            box-shadow: 0 0 0 0.25rem rgba(245, 158, 11, 0.25);
        }
        .input-group-text {
            background-color: #21262d !important;
            color: #94a3b8 !important;
            border: 1px solid #30363d !important;
        }
        .btn-orange {
            background-color: #f59e0b;
            color: #000000;
            font-weight: 800;
            border: none;
            padding: 12px;
            transition: background 0.2s;
        }
        .btn-orange:hover {
            background-color: #d97706;
        }
    </style>
</head>
<body>
    <div class="card-registro">
        <div class="text-center">
            <div class="logo-circle">
                <i class="fa-solid fa-qrcode text-dark fs-2"></i>
            </div>
            <h4 class="fw-bold mb-1 text-white">JeNoPro QR</h4>
            <p class="text-warning small mb-4 fw-semibold tracking-wide">REGISTRO DE NEGOCIO</p>
        </div>

        <form action="/registro" method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold d-block">NOMBRE DEL NEGOCIO</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-store"></i></span>
                    <input type="text" name="nombre" class="form-control" placeholder="Ej. Carpintería / Tacos" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold d-block">WHATSAPP (CON LADA)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                    <input type="text" name="telefono" class="form-control" placeholder="Ej. 526141234567">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold d-block">CORREO ELECTRÓNICO</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" name="correo" class="form-control" placeholder="tucorreo@gmail.com" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold d-block">CONTRASEÑA</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="********" required>
                </div>
            </div>
            <button type="submit" class="btn btn-orange w-100 shadow-sm">REGISTRAR Y CREAR MI PANEL &rarr;</button>
        </form>

        <div class="text-center mt-4 small">
            <span class="text-muted">¿Ya tienes cuenta?</span> <a href="/login" class="text-warning text-decoration-none fw-bold ms-1">Inicia sesión</a>
        </div>
    </div>
</body>
</html>
