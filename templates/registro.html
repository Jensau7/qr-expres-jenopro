<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - QR JeNoPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow p-4" style="width: 100%; max-width: 450px; border-radius: 12px;">
        <h2 class="text-center fw-bold mb-3">🚀 QR JeNoPro</h2>
        <p class="text-center text-muted mb-4">Crea tu menú o catálogo digital con QR</p>
        
        <form action="/registro" method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Nombre del Negocio</label>
                <input type="text" name="nombre" class="form-control" placeholder="Ej. Ingenio en Madera" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">WhatsApp del Negocio</label>
                <input type="text" name="telefono" class="form-control" placeholder="6141234567" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Correo Electrónico</label>
                <input type="email" name="correo" class="form-control" placeholder="correo@gmail.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="******" required>
            </div>
            <button type="submit" class="btn btn-dark w-100 fw-bold py-2">Registrar y Crear mi Panel</button>
        </form>
    </div>
</body>
</html>
