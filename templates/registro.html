<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - JeNoPro QR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .card-registro {
            background: #1e252b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .logo-circle {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px auto;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }
        .btn-orange {
            background-color: #f59e0b;
            color: #000;
            font-weight: bold;
            border: none;
        }
        .btn-orange:hover {
            background-color: #d97706;
        }
    </style>
</head>
<body>
    <div class="card-registro">
        <div class="text-center">
            <div class="logo-circle">
                <i class="fa-solid fa-qrcode text-dark fs-2"></i>
            </div>
            <h4 class="fw-bold mb-1">JeNoPro QR</h4>
            <p class="text-muted small mb-4">REGISTRO DE NEGOCIO</p>
        </div>

        <form action="/registro" method="POST">
            <div class="mb-3">
                <label class="form-label small text-muted fw-bold">NOMBRE DEL NEGOCIO</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-muted border-secondary"><i class="fa-solid fa-store"></i></span>
                    <input type="text" name="nombre" class="form-control bg-dark text-white border-secondary" placeholder="Ej. Carpintería / Tacos El Paisa" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label small text-muted fw-bold">WHATSAPP DEL NEGOCIO (CON LADA)</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-muted border-secondary"><i class="fa-solid fa-phone"></i></span>
                    <input type="text" name="telefono" class="form-control bg-dark text-white border-secondary" placeholder="Ej. 526141234567">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label small text-muted fw-bold">CORREO ELECTRÓNICO</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-muted border-secondary"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" name="correo" class="form-control bg-dark text-white border-secondary" placeholder="tucorreo@gmail.com" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small text-muted fw-bold">CONTRASEÑA</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark text-muted border-secondary"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="********" required>
                </div>
            </div>
            <button type="submit" class="btn btn-orange w-100 py-2">REGISTRAR Y CREAR MI PANEL &rarr;</button>
        </form>

        <div class="text-center mt-4 small">
            <span class="text-muted">¿Ya tienes una cuenta activada?</span> <a href="/login" class="text-warning text-decoration-none fw-bold">Inicia sesión aquí</a>
        </div>
    </div>
</body>
</html>
