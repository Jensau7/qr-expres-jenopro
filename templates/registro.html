<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - JeNoPro QR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            background-image: radial-gradient(circle at center, #1b2230 0%, #0b0f19 100%);
            color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 15px;
        }
        .card-registro {
            background: #121824;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 28px 22px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }
        
        /* Insignia Oficial */
        .badge-oficial {
            background-color: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.3);
            font-size: 0.68rem;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        }

        /* Contenedor del Logo 3D */
        .logo-3d-wrapper {
            width: 125px;
            height: 125px;
            margin: 0 auto 6px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0px 8px 25px rgba(234, 179, 8, 0.5));
        }

        /* Formulario */
        .form-label {
            color: #d97706 !important;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .input-group-custom {
            background-color: #0d111a;
            border: 1px solid #232d3f;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            margin-bottom: 14px;
        }
        .input-icon {
            padding: 10px 12px;
            color: #5d6b82;
            font-size: 0.85rem;
        }
        .form-control-custom {
            background: transparent !important;
            border: none !important;
            color: #ffffff !important;
            font-size: 0.85rem;
            padding: 10px 10px 10px 0;
            width: 100%;
            outline: none;
        }
        .form-control-custom::placeholder {
            color: #3b475c !important;
        }

        /* Select de LADA con triangulito */
        .select-lada {
            background-color: #161c28;
            color: #fbbf24;
            border: none;
            border-right: 1px solid #232d3f;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 10px 8px;
            outline: none;
            cursor: pointer;
        }
        .select-lada option {
            background-color: #121824;
            color: #ffffff;
        }

        /* Botón Naranja */
        .btn-orange-jn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #000000;
            font-weight: 900;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            border: none;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
            transition: all 0.2s ease;
        }
        .btn-orange-jn:hover {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
        }
    </style>
</head>
<body>

    <div class="card-registro">
        <div class="text-center">
            <!-- Insignia Oficial Verde -->
            <div class="badge-oficial">
                <i class="fa-solid fa-circle-check"></i> Plataforma Oficial
            </div>

            <!-- LOGOTIPO VECTORIAL DORADO METALICO 3D AJUSTADO -->
            <div class="logo-3d-wrapper">
                <svg width="125" height="125" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Degradados Dorado Biselado 3D -->
                        <linearGradient id="goldBright" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFF8D0" />
                            <stop offset="25%" stop-color="#F59E0B" />
                            <stop offset="50%" stop-color="#D97706" />
                            <stop offset="75%" stop-color="#78350F" />
                            <stop offset="100%" stop-color="#FFF0A0" />
                        </linearGradient>

                        <linearGradient id="goldGold3D" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#78350F" />
                            <stop offset="40%" stop-color="#FBBF24" />
                            <stop offset="70%" stop-color="#F59E0B" />
                            <stop offset="100%" stop-color="#451A03" />
                        </linearGradient>

                        <radialGradient id="innerBg" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#261a08" />
                            <stop offset="85%" stop-color="#0d0a04" />
                            <stop offset="100%" stop-color="#121824" />
                        </radialGradient>
                    </defs>

                    <!-- Anillo Exterior Dorado 3D Relieve -->
                    <circle cx="100" cy="100" r="88" fill="url(#innerBg)" stroke="url(#goldBright)" stroke-width="10"/>
                    <circle cx="100" cy="100" r="82" stroke="url(#goldGold3D)" stroke-width="3" fill="none"/>

                    <!-- Flecha de Recarga Circular Superior/Inferior -->
                    <path d="M 100 12 A 88 88 0 0 1 188 100" fill="none" stroke="url(#goldBright)" stroke-width="8" stroke-linecap="round"/>
                    <polygon points="98,2 118,12 98,22" fill="url(#goldBright)"/>
                    <polygon points="102,178 82,188 102,198" fill="url(#goldBright)"/>

                    <!-- Letras JN Doradas Metalicas Grandes -->
                    <text x="52" y="112" font-family="'Arial Black', sans-serif" font-weight="900" font-size="54" fill="url(#goldBright)" letter-spacing="-3">J</text>
                    <text x="94" y="112" font-family="'Arial Black', sans-serif" font-weight="900" font-size="54" fill="url(#goldGold3D)" letter-spacing="-3">N</text>

                    <!-- Icono QR Metálico Abajo -->
                    <g transform="translate(81, 126)" fill="url(#goldBright)">
                        <rect x="0" y="0" width="12" height="12" rx="1"/>
                        <rect x="2" y="2" width="8" height="8" fill="#121824"/>
                        <rect x="4" y="4" width="4" height="4"/>

                        <rect x="26" y="0" width="12" height="12" rx="1"/>
                        <rect x="28" y="2" width="8" height="8" fill="#121824"/>
                        <rect x="30" y="4" width="4" height="4"/>

                        <rect x="0" y="26" width="12" height="12" rx="1"/>
                        <rect x="2" y="28" width="8" height="8" fill="#121824"/>
                        <rect x="4" y="30" width="4" height="4"/>

                        <rect x="16" y="16" width="6" height="6"/>
                        <rect x="26" y="26" width="6" height="6"/>
                        <rect x="16" y="32" width="6" height="6"/>
                        <rect x="32" y="16" width="6" height="6"/>
                    </g>
                </svg>
            </div>

            <h4 class="fw-bold mb-0 text-white" style="letter-spacing: -0.5px;">JeNoPro QR</h4>
            <p class="text-warning small fw-bold mb-4" style="font-size: 0.72rem; letter-spacing: 0.5px;">REGISTRO DE NEGOCIO - JeNoPro QR</p>
        </div>

        <form action="/registro" method="POST">
            <div class="mb-1">
                <label class="form-label"><i class="fa-solid fa-store"></i> NOMBRE DEL NEGOCIO</label>
                <div class="input-group-custom">
                    <span class="input-icon"><i class="fa-solid fa-building"></i></span>
                    <input type="text" name="nombre" class="form-control-custom" placeholder="Tacos El Paisa" required>
                </div>
            </div>

            <div class="mb-1">
                <label class="form-label"><i class="fa-solid fa-phone"></i> WHATSAPP DEL NEGOCIO</label>
                <div class="input-group-custom">
                    <span class="input-icon"><i class="fa-solid fa-mobile-screen"></i></span>
                    <!-- Desplegable LADA Opcional con +52 por defecto -->
                    <select name="lada" class="select-lada">
                        <option value="+52" selected>+52 (MX) &#9660;</option>
                        <option value="+1">+1 (US/CA)</option>
                        <option value="+34">+34 (ES)</option>
                        <option value="+54">+54 (AR)</option>
                        <option value="+57">+57 (CO)</option>
                        <option value="+502">+502 (GT)</option>
                    </select>
                    <input type="tel" name="telefono" class="form-control-custom ps-2" placeholder="Ej. 6141234567" required>
                </div>
            </div>

            <div class="mb-1">
                <label class="form-label"><i class="fa-solid fa-envelope"></i> CORREO ELECTRÓNICO</label>
                <div class="input-group-custom">
                    <span class="input-icon"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" name="correo" class="form-control-custom" placeholder="tucorreo@gmail.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label"><i class="fa-solid fa-lock"></i> CONTRASEÑA</label>
                <div class="input-group-custom">
                    <span class="input-icon"><i class="fa-solid fa-key"></i></span>
                    <input type="password" name="password" class="form-control-custom" placeholder="********" required>
                </div>
            </div>

            <button type="submit" class="btn btn-orange-jn w-100 mt-2">
                REGISTRAR Y CREAR MI PANEL &rarr;
            </button>
        </form>

        <div class="text-center mt-3 small" style="font-size: 0.78rem;">
            <span class="text-secondary">¿Ya tienes cuenta?</span> 
            <a href="/login" class="text-warning text-decoration-none fw-bold ms-1">Inicia sesión aquí</a>
        </div>
    </div>

</body>
</html>
